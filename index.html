  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #202124;
      --muted: #6b6f76;
      --faint: #b9bcc1;
      --line: #e3e2dd;
      --card: #ffffff;
      --orange: #e37400;
      --amber: #f4a300;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131416;
        --ink: #e8e8e6;
        --muted: #9a9ea5;
        --faint: #55595f;
        --line: #2a2c30;
        --card: #1b1c1f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    header {
      width: 100%;
      max-width: 960px;
      padding: 20px 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--muted);
      font-size: 13px;
    }
    header .name { color: var(--ink); font-weight: 600; letter-spacing: .01em; }
    #counter { transition: opacity .6s; }

    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ---------- the mark ---------- */
    #stage { width: min(78vw, 58vh, 460px); aspect-ratio: 1; position: relative; }
    #mark { width: 100%; height: 100%; display: block; overflow: visible; cursor: default; }
    .piece { transform-box: fill-box; transform-origin: center; }
    .piece.gone {
      transition: transform 1.1s cubic-bezier(.5,0,.75,0), opacity 1.1s ease-in;
      opacity: 0;
      pointer-events: none;
    }
    .flaw { transition: opacity .5s; pointer-events: none; }
    .hit { fill: transparent; cursor: default; outline: none; }
    .hit:hover + .flaw, .hit:focus + .flaw { opacity: 1 !important; }
    .hit:focus-visible { stroke: var(--muted); stroke-width: .8; stroke-dasharray: 2 2; }
    .hint { animation: hint 1.4s ease-in-out 2; }
    @keyframes hint { 50% { opacity: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,.5)); } }

    /* ---------- captions ---------- */
    #caption {
      min-height: 64px;
      margin-top: 18px;
      text-align: center;
      transition: opacity .4s;
    }
    #caption .label { font-size: 16px; font-weight: 600; }
    #caption .sub { color: var(--muted); font-size: 13px; }
    #prompt { color: var(--muted); font-size: 13px; margin-top: 4px; transition: opacity .6s; }

    /* ---------- the empty report ---------- */
    #end {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.6s ease;
      padding: 0 16px;
    }
    #end.show { opacity: 1; pointer-events: auto; }
    .report {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .report .bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .report .body { padding: 44px 24px 36px; text-align: center; }
    .report .empty-icon { width: 44px; height: 44px; margin: 0 auto 14px; color: var(--faint); }
    .report h1 { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
    .report p { color: var(--muted); margin: 0; font-size: 14px; }
    .links { display: flex; gap: 20px; justify-content: center; margin-top: 26px; font-size: 14px; }
    .links a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--faint); padding-bottom: 1px; }
    .links a:hover { border-color: var(--orange); }
    .reprocess {
      margin-top: 22px;
      background: none;
      border: 0;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .reprocess:hover { color: var(--ink); }

    footer { padding: 18px 16px 22px; color: var(--faint); font-size: 12px; text-align: center; }

    /* ---------- consent banner ---------- */
    #cookie-consent-popup {
      position: fixed;
      left: 16px; right: 16px; bottom: 16px;
      max-width: 380px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      z-index: 10;
    }
    #cookie-consent-popup p { margin: 0 0 10px; color: var(--muted); }
    .cookie-actions { display: flex; gap: 8px; }
    .cookie-actions button {
      font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--ink);
    }
    .cookie-actions #cookie-accept { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .piece.gone { transform: none !important; transition: opacity .8s; }
      .hint { animation: none; }
    }
  </style>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB76FS5Q" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header>
    <span class="name">Stefan DeZarn</span>
    <span id="counter" class="mono" aria-live="polite"></span>
  </header>

  <main>
    <div id="stage">
      <svg id="mark" viewBox="0 0 400 400" role="img" aria-label="A bar chart mark with hidden imperfections">
        <defs id="defs">
          <linearGradient id="gTall" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="340">
            <stop offset="0" stop-color="#ec8510"/><stop offset="1" stop-color="#d96a00"/>
          </linearGradient>
          <linearGradient id="gMid" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="340">
            <stop offset="0" stop-color="#f8b21a"/><stop offset="1" stop-color="#f09d00"/>
          </linearGradient>
          <linearGradient id="gDot" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="340">
            <stop offset="0" stop-color="#f8b21a"/><stop offset="1" stop-color="#f09d00"/>
          </linearGradient>
        </defs>
        <g id="pieces"></g>
      </svg>
    </div>

    <div id="caption" aria-live="polite"></div>
    <div id="prompt">Find the imperfections.</div>

    <section id="end" aria-hidden="true">
      <div class="report">
        <div class="bar mono"><span>stefandezarn.com</span><span>All users</span></div>
        <div class="body">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 16h10M7 12h4"/>
          </svg>
          <h1>This content is <span class="mono">(not set)</span>.</h1>
          <p>The site is under construction.</p>
          <div class="links">
            <a id="email-link" href="mailto:sjdezarn@gmail.com">Email</a>
            <a href="https://www.linkedin.com/in/stefan-dezarn-7891b2231" target="_blank" rel="noopener">LinkedIn</a>
          </div>
          <button class="reprocess mono" id="reprocess" type="button">↻ Reprocess data</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="mono">Data may take up to 48 hours to appear.</footer>

  <div id="cookie-consent-popup" style="display: none;">
    <p>This page uses cookies for analytics. Fittingly.</p>
    <div class="cookie-actions">
      <button id="cookie-accept">Accept</button>
      <button id="cookie-reject">Reject</button>
    </div>
  </div>

  <script src="assets/cookie-consent.js"></script>
  <script src="assets/game.js"></script>
